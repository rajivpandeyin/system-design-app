version: '3.8'
services:
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - '5432:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql/data
  auth-redis:
    image: redis:7
    ports:
      - '6379:6379'
  auth-service:
    build: .
    command: npm run dev
    environment:
      - PORT=4004
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/authdb
      - REDIS_URL=redis://auth-redis:6379
      - JWT_ACCESS_SECRET=dev-access-secret
      - JWT_REFRESH_SECRET=dev-refresh-secret
    ports:
      - '4004:4004'
    depends_on:
      - auth-db
      - auth-redis
volumes:
  auth-db-data:
